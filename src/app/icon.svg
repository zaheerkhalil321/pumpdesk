<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="pumpGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="32" height="32" rx="7.5" fill="url(#pumpGrad)"/>

  <!-- Subtle inner border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" stroke="white" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Mast / Base Tower of Pump Truck -->
  <rect x="6.5" y="5.5" width="3.2" height="21" rx="1.6" fill="white"/>

  <!-- Articulated Boom Arm Loop forming 'P' -->
  <path d="M8.5 7.5H16C19.59 7.5 22.5 10.41 22.5 14C22.5 17.59 19.59 20.5 16 20.5H8.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Boom Joint & Placement Delivery Line -->
  <path d="M18.8 20.5V23.5C18.8 24.1 18.3 24.6 17.7 24.6C17.1 24.6 16.6 24.1 16.6 23.5V20.5" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Concrete Pour Drop / Target Node -->
  <circle cx="17.7" cy="26.7" r="1.3" fill="white"/>
</svg>
